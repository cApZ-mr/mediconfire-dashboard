<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Übersicht – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="css/dashboard.css" rel="stylesheet">
    <link href="css/control-center.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div>
                <h1 class="page-title">Übersicht</h1>
                <p class="text-secondary mb-0">Alles Wichtige zu deinem Bot auf einen Blick.</p>
            </div>
            <span class="ms-auto d-flex align-items-center gap-2"><span class="dot" id="botDot"></span><span class="fw-semibold" id="botState">Bot …</span></span>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3">
                <div class="card card-hero h-100 p-4"><small class="text-secondary">Nächster Stream</small>
                    <div class="fs-4 fw-bold" id="statStream">–</div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card h-100 p-4"><small class="text-secondary">Server</small>
                    <div class="fs-4 fw-bold" id="statGuilds">–</div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card h-100 p-4"><small class="text-secondary">Offene Todos</small>
                    <div class="fs-4 fw-bold" id="statTodos">–</div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card h-100 p-4"><small class="text-secondary">Join Roles</small>
                    <div class="fs-4 fw-bold" id="statJoin">–</div>
                </div>
            </div>
        </div>

    <section id="control-center"></section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/control-center.js"></script>
</body>

</html>
