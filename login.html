<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login – MedicOnFire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">

    <style>
        * {
            font-family: 'Manrope', sans-serif;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
        }

        .login-card {
            width: min(420px, calc(100% - 32px));
            padding: 42px 36px;
            text-align: center;

            background: #111;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 800;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #999;
            font-size: .95rem;
        }

        .discord-btn {
            width: 100%;
            padding: 13px 18px;

            border: 0;
            border-radius: 12px;

            background: #5865F2;
            color: white;

            font-weight: 700;
            font-size: .95rem;

            transition: .2s ease;
        }

        .discord-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .footer {
            margin-top: 24px;
            color: #666;
            font-size: .75rem;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <img
            src="img/MedicOnFire_Logo.png"
            alt="MedicOnFire"
            class="logo"
        >

        <h1>MedicOnFire</h1>

        <p class="subtitle">
            Melde dich an, um das Dashboard zu öffnen.
        </p>

        <button class="discord-btn" id="loginBtn">
            Mit Discord anmelden
        </button>

        <div class="footer">
            Nur für autorisierte Benutzer
        </div>

    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const next = params.get('next') || '/';

        document.getElementById('loginBtn').onclick = () => {
            const safeNext = next.startsWith('/') && !next.startsWith('//')
                ? next
                : '/';

            location.href = '/auth/login?next=' + encodeURIComponent(safeNext);
        };
    </script>

</body>

</html>
