<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login – MedicOnFire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">

    <style>
        * {
            font-family: 'Manrope', sans-serif;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(700px 420px at 50% 0%, rgba(255, 106, 0, .14), transparent 65%),
                #050505;
            color: #ededf0;
        }

        .login-card {
            width: min(420px, calc(100% - 32px));
            padding: 42px 36px;
            text-align: center;

            background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .01));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;
            backdrop-filter: blur(12px);

            box-shadow: 0 30px 80px -30px rgba(255, 106, 0, .35);
            animation: rise .8s cubic-bezier(.16, 1, .3, 1);
        }

        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98) } }
        @keyframes float { 50% { transform: translateY(-6px) } }

        @media (prefers-reduced-motion: reduce) {
            .login-card, .logo { animation: none !important }
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 22px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 24px rgba(255, 106, 0, .35));
        }

        h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 800;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #999;
            font-size: .95rem;
        }

        .discord-btn {
            width: 100%;
            padding: 13px 18px;

            border: 0;
            border-radius: 12px;

            background: #5865F2;
            color: white;

            font-weight: 700;
            font-size: .95rem;

            transition: transform .2s cubic-bezier(.16, 1, .3, 1), box-shadow .3s, filter .2s;
            box-shadow: 0 10px 30px -12px rgba(88, 101, 242, .8);
        }

        .discord-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 14px 34px -12px rgba(88, 101, 242, 1);
        }

        .discord-btn:active { transform: scale(.97) }

        .footer {
            margin-top: 24px;
            color: #666;
            font-size: .75rem;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <img
            src="img/MedicOnFire_Logo.png"
            alt="MedicOnFire"
            class="logo"
        >

        <h1>MedicOnFire</h1>

        <p class="subtitle">
            Melde dich an, um das Dashboard zu öffnen.
        </p>

        <button class="discord-btn" id="loginBtn">
            Mit Discord anmelden
        </button>

        <div class="footer">
            Nur für autorisierte Benutzer
        </div>

    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const next = params.get('next') || '/';

        document.getElementById('loginBtn').onclick = () => {
            const safeNext = next.startsWith('/') && !next.startsWith('//')
                ? next
                : '/';

            location.href = '/auth/login?next=' + encodeURIComponent(safeNext);
        };
    </script>

</body>

</html>
