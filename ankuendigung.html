<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ankündigung – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <h1 class="page-title">Stream-Ankündigung</h1>
        <p class="text-secondary mb-4">So sieht die Nachricht aus, wenn dein Stream startet. Der Bot nutzt diese Einstellungen beim automatischen Live-Ping.</p>
        <div class="row g-4">
            <div class="col-lg-6">
                <form class="card p-4" id="annForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="a_channel">Kanal</label>
                            <select class="form-select" id="a_channel" name="channel" required>
                                <option value="">Lädt …</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="a_ping">Wer wird gepingt?</label>
                            <select class="form-select" id="a_ping" name="ping">
                                <option value="">Niemand</option>
                                <option value="everyone">@everyone</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="a_title">Titel</label>
                            <input class="form-control" id="a_title" name="title" value="Wir sind live!">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="a_text">Beschreibung</label>
                            <textarea class="form-control" id="a_text" name="text" rows="4">Heute geht's um Ranked. Kommt vorbei!</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="a_time">Startzeit</label>
                            <input class="form-control" type="datetime-local" id="a_time" name="time">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="a_link">Stream-Link</label>
                            <input class="form-control" type="url" id="a_link" name="link" value="https://twitch.tv/dein-kanal">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="a_color">Farbe</label>
                            <input class="form-control form-control-color w-100" type="color" id="a_color" name="color" value="#ff6a00">
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="a_auto" name="auto" checked>
                                <label class="form-check-label" for="a_auto">Automatisch beim Start senden</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Änderungen speichern</button>
                        <button class="btn btn-outline-light" type="button" id="testBtn">Test senden</button>
                    </div>
                </form>
            </div>
            <div class="col-lg-6">
                <div class="card p-4">
                    <div class="section-title mb-3">Live-Vorschau</div>
                    <div class="preview dc-msg">
                        <div class="dc-pfp"></div>
                        <div class="flex-grow-1">
                            <strong class="text-white">MedicOnFire</strong> <span class="dc-bot">BOT</span> <small class="text-secondary">heute</small>
                            <div id="pv_ping" class="mt-1"></div>
                            <div class="embed" id="pv_embed">
                                <h6 id="pv_title"></h6>
                                <div id="pv_text" class="mb-2"></div>
                                <div id="pv_time" class="small text-secondary"></div>
                                <a id="pv_link" class="small" href="#"></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-ankuendigung.js"></script>
</body>

</html>
