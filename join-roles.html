<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Roles – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body data-need="roles">
    <div id="app-header"></div>
    <main class="container py-5">
        <h1 class="page-title">Join Roles</h1>
        <p class="text-secondary mb-4">Diese Rollen bekommen neue Mitglieder automatisch beim Beitritt.</p>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card p-4" data-write>
                    <div id="roles"></div>
                    <button class="btn btn-primary mt-3 align-self-start" id="saveRoles" type="button">Änderungen speichern</button>
                </div>
            </div>
            <div class="col-lg-5">
                <form class="card p-4" id="addRole" data-write>
                    <h5 class="mb-3">Rolle hinzufügen</h5>
                    <div class="mb-3">
                        <label class="form-label" for="r_name">Rolle</label>
                        <select class="form-select" id="r_name">
                            <option value="">Lädt …</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="r_delay">Vergeben</label>
                        <select class="form-select" id="r_delay">
                            <option value="0">Sofort</option>
                            <option value="5">Nach 5 Minuten</option>
                            <option value="10">Nach 10 Minuten</option>
                            <option value="60">Nach 1 Stunde</option>
                        </select>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="r_bots" checked>
                        <label class="form-check-label" for="r_bots">Bots ausschließen</label>
                    </div>
                    <button class="btn btn-primary" type="submit">Hinzufügen</button>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-join-roles.js"></script>
</body>

</html>
