<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lobby-Code – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <h1 class="page-title">Wardogs Code</h1>
        <p class="text-secondary mb-4">Trage hier den aktuellen Lobby-Code ein. Mit <code>!wardogs</code> schickt der Bot ihn in den Chat – inklusive Alter des Codes.</p>
        <div class="col-lg-5">
            <form class="card p-4 mb-3" id="codeForm" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label" for="code">Lobby-Code</label>
                    <input class="form-control form-control-lg" id="code" name="code" maxlength="32" required
                        placeholder="z. B. ABC123" spellcheck="false">
                    <div class="form-text">Maximal 32 Zeichen, ohne Leerzeichen.</div>
                </div>
                <button class="btn btn-primary w-100" type="submit" id="saveBtn">Code speichern</button>
            </form>
            <div class="card p-4">
                <h6 class="mb-3">Aktuell beim Bot</h6>
                <div id="current" class="text-secondary">Lädt …</div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-lobby-code.js"></script>
</body>

</html>
