<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nachrichten löschen – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body data-action="delete">
    <div id="app-header"></div>
    <main class="container py-5">
        <div class="eyebrow mb-1" style="color:var(--danger)">Admin</div>
        <h1 class="page-title">Nachrichten löschen</h1>
        <p class="text-secondary mb-4">Eine einzelne Nachricht per Link löschen oder in einem Kanal aufräumen.</p>
        <div class="row g-4">
            <div class="col-lg-6">
                <form class="card p-4 h-100" id="linkForm">
                    <div class="section-title mb-3">Einzelne Nachricht</div>
                    <label class="form-label" for="msgLink">Nachrichten-Link</label>
                    <input class="form-control" id="msgLink" required placeholder="https://discord.com/channels/…" autocomplete="off">
                    <div class="form-text">In Discord: Rechtsklick auf die Nachricht → <strong>Nachrichtenlink kopieren</strong>.</div>
                    <div class="mt-4"><button class="btn btn-danger" type="submit"><i class="ti ti-trash" aria-hidden="true"></i> Löschen</button></div>
                </form>
            </div>
            <div class="col-lg-6">
                <form class="card p-4 h-100" id="actForm">
                    <div class="section-title mb-3">Kanal aufräumen</div>
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label" for="purgeChannel">Kanal</label>
                            <select class="form-select" id="purgeChannel" required><option value="">Lädt …</option></select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label" for="purgeCount">Letzte Nachrichten</label>
                            <input class="form-control" type="number" id="purgeCount" min="1" max="100" value="10" required>
                        </div>
                    </div>
                    <div class="form-text">Maximal 100 auf einmal. Nachrichten älter als 14 Tage lässt Discord hier nicht löschen.</div>
                    <div class="mt-4"><button class="btn btn-danger" type="submit" id="actBtn"><i class="ti ti-eraser" aria-hidden="true"></i> Löschen</button></div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-admin.js"></script>
</body>

</html>
