<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streamplan – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <h1 class="page-title">Streamplan</h1>
        <p class="text-secondary mb-4">Schalte Tage ein, trage Zeit und Titel ein und sende den Plan als Embed in den Streamplan-Kanal.</p>
        <form id="planForm">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card p-4">
                        <div id="days"></div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card p-4 mb-3">
                        <div class="mb-3">
                            <label class="form-label" for="ptitle">Überschrift</label>
                            <input class="form-control" id="ptitle" name="ptitle" value="Streamplan diese Woche">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pfoot">Fußzeile</label>
                            <input class="form-control" id="pfoot" name="pfoot" placeholder="z. B. Änderungen vorbehalten">
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="replace" name="replace" checked>
                            <label class="form-check-label" for="replace">Alten Plan ersetzen</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit" id="sendBtn">Streamplan senden</button>
                        <div class="form-text" id="lastSent"></div>
                    </div>
                    <div class="card p-4">
                        <h6 class="mb-3">Vorschau</h6>
                        <div class="preview">
                            <div><strong class="text-white">MedicOnFire</strong> <small class="text-secondary">heute</small></div>
                            <div class="embed" style="border-left-color:#e67e22">
                                <h6 id="pv_title"></h6>
                                <div id="pv_lines" style="white-space:pre-line"></div>
                                <div id="pv_foot" class="small text-secondary mt-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-streamplan.js"></script>
</body>

</html>
