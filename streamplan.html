<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streamplan – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <h1 class="page-title">Streamplan</h1>
        <p class="text-secondary mb-4">Füge beliebig viele Streams hinzu – auch mehrere am selben Tag. Ohne Uhrzeit oder Titel steht dort „Spontan“. Der Plan wird Tag für Tag mit Logo in den Streamplan-Kanal gesendet.</p>
        <form id="planForm">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card p-4">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <div class="section-title">Streams</div>
                            <span class="tag" id="entryCount"></span>
                            <button class="btn btn-outline-light btn-sm ms-auto" type="button" id="addEntry"><i class="ti ti-plus" aria-hidden="true"></i> Stream hinzufügen</button>
                        </div>
                        <div id="entries"></div>
                        <div class="d-flex flex-wrap gap-3 mt-3 pt-3" style="border-top:1px solid var(--line)">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="showPause" name="show_pause" checked>
                                <label class="form-check-label" for="showPause">Tage ohne Stream als „Pause“ zeigen</label>
                            </div>
                            <button class="btn btn-outline-light btn-sm ms-auto" type="button" id="clearEntries">Alle entfernen</button>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card p-4 mb-3">
                        <div class="mb-3">
                            <label class="form-label" for="ptitle">Überschrift</label>
                            <input class="form-control" id="ptitle" name="ptitle" value="Streamplan diese Woche">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pfoot">Fußzeile</label>
                            <input class="form-control" id="pfoot" name="pfoot" placeholder="z. B. Änderungen vorbehalten">
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="replace" name="replace" checked>
                            <label class="form-check-label" for="replace">Alten Plan ersetzen</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit" id="sendBtn">Streamplan senden</button>
                        <div class="form-text" id="lastSent"></div>
                    </div>
                    <div class="card p-4 mb-3">
                        <div class="section-title mb-3">Pings &amp; Erinnerung</div>
                        <label class="form-label">Wer wird gepingt?</label>
                        <div class="d-flex flex-wrap gap-2 mb-3" id="pingRoles"><span class="small text-secondary">Lädt …</span></div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="remOn">
                            <label class="form-check-label" for="remOn">Vor geplanten Streams erinnern</label>
                        </div>
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <select class="form-select form-select-sm" id="remMin" style="width:auto" aria-label="Wie lange vorher">
                                <option value="10">10 Minuten</option>
                                <option value="15">15 Minuten</option>
                                <option value="30" selected>30 Minuten</option>
                                <option value="60">1 Stunde</option>
                                <option value="120">2 Stunden</option>
                            </select>
                            <span class="small text-secondary">vorher, mit denselben Pings</span>
                        </div>
                        <button class="btn btn-outline-light btn-sm" type="button" id="saveSettings">Pings &amp; Erinnerung speichern</button>
                    </div>
                    <div class="card p-4">
                        <div class="section-title mb-3">Live-Vorschau</div>
                        <div class="preview dc-msg">
                            <div class="dc-pfp"></div>
                            <div class="flex-grow-1" style="min-width:0">
                                <strong class="text-white">MedicOnFire</strong> <span class="dc-bot">BOT</span> <small class="text-secondary">heute</small>
                                <div class="mt-1" id="pv_ping"></div>
                                <div class="embed live-embed" id="pv_embed" style="border-left-color:#e67e22">
                                    <div class="live-embed-head">
                                        <div class="min-w-0 flex-grow-1">
                                            <h6 id="pv_title"></h6>
                                            <div class="mt-2" id="pv_lines"></div>
                                        </div>
                                        <img class="live-thumb" src="img/MedicOnFire_Logo.png" alt="">
                                    </div>
                                    <div id="pv_foot" class="small text-secondary mt-2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-streamplan.js"></script>
</body>

</html>
