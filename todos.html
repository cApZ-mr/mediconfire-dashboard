<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todos – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <div class="d-flex align-items-end mb-4">
            <div>
                <h1 class="page-title">Todos</h1>
                <p class="text-secondary mb-0">Dieselben Listen wie <code>!todo</code>, <code>!todos</code> und <code>!done</code> im Discord.</p>
            </div><span class="ms-auto badge rounded-pill badge-prio fs-6" id="openCount"></span></div>
        <form class="card p-3 mb-3" id="addTodo">
            <div class="row g-2">
                <div class="col-md">
                    <input class="form-control" id="t_text" placeholder="Was ist zu tun?" aria-label="Neues Todo" required>
                </div>
                <div class="col-6 col-md-3">
                    <input class="form-control" id="t_list" list="t_lists" placeholder="Liste" aria-label="Liste" required maxlength="100">
                    <datalist id="t_lists"></datalist>
                </div>
                <div class="col-6 col-md-auto">
                    <button class="btn btn-primary w-100" type="submit">Hinzufügen</button>
                </div>
            </div>
        </form>
        <div class="card px-4 py-2">
            <div id="todos"></div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-todos.js"></script>
</body>

</html>
