<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verlauf – MedicOnFire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/MedicOnFire_Logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div id="app-header"></div>
    <main class="container py-5">
        <h1 class="page-title">Verlauf</h1>
        <p class="text-secondary mb-4">Wer hat im Dashboard wann was gemacht – und was ist auf dem Server passiert.</p>
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-4">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <div class="section-title">Dashboard-Aktionen</div>
                        <input class="form-control form-control-sm ms-auto" id="histSearch" placeholder="Suchen …" style="max-width:180px" aria-label="Verlauf durchsuchen">
                    </div>
                    <div id="history"><p class="text-secondary small mb-0">Lädt …</p></div>
                </div>
            </div>
            <div class="col-lg-6 admin-only">
                <div class="card p-4">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                        <div class="section-title">Server-Ereignisse</div>
                        <select class="form-select form-select-sm ms-auto" id="logKind" style="width:auto" aria-label="Art der Ereignisse">
                            <option value="">Alle</option>
                            <option value="message_delete">Gelöschte Nachrichten</option>
                            <option value="voice">Voice</option>
                            <option value="join_leave">Beitritte / Austritte</option>
                        </select>
                    </div>
                    <div id="serverLog"><p class="text-secondary small mb-0">Lädt …</p></div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-verlauf.js"></script>
</body>

</html>
